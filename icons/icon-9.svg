<circle cx="158" cy="140" r="10" fill="white" opacity="0.7"/>
<circle cx="200" cy="140" r="10" fill="white" opacity="0.7"/>
<circle cx="242" cy="140" r="10" fill="white" opacity="0.7"/>
</svg>