<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#eef2ff"/><stop offset="100%" stop-color="#c7d2fe"/></linearGradient>
<clipPath id="r"><rect width="512" height="512" rx="112"/></clipPath></defs>
<rect width="512" height="512" rx="112" fill="url(#bg)"/>
<!-- big chat bubble -->
<path d="M80 120 Q80 80 120 80 L392 80 Q432 80 432 120 L432 310 Q432 350 392 350 L290 350 L256 410 L222 350 L120 350 Q80 350 80 310 Z" fill="#4f46e5"/>
