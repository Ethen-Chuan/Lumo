  <ellipse cx="256" cy="460" rx="140" ry="160" fill="#1e1b4b"/>
</g>
<!-- eyes inside bubble -->
<circle cx="210" cy="230" r="40" fill="white"/>
<circle cx="218" cy="238" r="23" fill="#0d0d1a"/>
<circle cx="204" cy="224" r="9" fill="white"/>
<circle cx="302" cy="230" r="40" fill="white"/>
<circle cx="310" cy="238" r="23" fill="#0d0d1a"/>
<circle cx="296" cy="224" r="9" fill="white"/>
