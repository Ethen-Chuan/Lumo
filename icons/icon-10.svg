<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0ea5e9"/><stop offset="100%" stop-color="#0284c7"/></linearGradient>
<clipPath id="r"><rect width="512" height="512" rx="112"/></clipPath></defs>
<rect width="512" height="512" rx="112" fill="url(#bg)"/>
<!-- cloud puffs -->
<ellipse cx="100" cy="350" rx="60" ry="30" fill="white" opacity="0.25"/>
<ellipse cx="60" cy="340" rx="40" ry="24" fill="white" opacity="0.2"/>
<ellipse cx="400" cy="400" rx="50" ry="25" fill="white" opacity="0.2"/>
<!-- rocket flame -->
<ellipse cx="256" cy="450" rx="28" ry="46" fill="#fbbf24"/>
<ellipse cx="256" cy="455" rx="18" ry="35" fill="#f97316"/>
<!-- rocket body (blob shape) -->
<g clip-path="url(#r)">
  <ellipse cx="256" cy="310" rx="90" ry="120" fill="#1e3a5f"/>
</g>
<!-- rocket nose cone -->
<path d="M196 220 Q256 130 316 220" fill="#1e3a5f"/>
<!-- windows / eyes -->
<circle cx="220" cy="280" r="34" fill="white"/>
<circle cx="226" cy="287" r="19" fill="#0d0d1a"/>
<circle cx="215" cy="275" r="8" fill="white"/>
<circle cx="292" cy="280" r="34" fill="white"/>
<circle cx="298" cy="287" r="19" fill="#0d0d1a"/>
<circle cx="287" cy="275" r="8" fill="white"/>
<!-- rocket fins -->
<path d="M166 360 L196 300 L196 380 Z" fill="#1e3a5f"/>
<path d="M346 360 L316 300 L316 380 Z" fill="#1e3a5f"/>
<!-- stars -->
<circle cx="100" cy="120" r="4" fill="white" opacity="0.8"/>
<circle cx="380" cy="100" r="3" fill="white" opacity="0.7"/>
<circle cx="430" cy="200" r="5" fill="white" opacity="0.6"/>
<text x="80" y="200" font-size="24" fill="white" opacity="0.6" font-family="Arial">★</text>
</svg>