<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <clipPath id="circle">
      <circle cx="200" cy="200" r="200"/>
    </clipPath>
  </defs>

  <!-- Background circle -->
  <circle cx="200" cy="200" r="200" fill="url(#bg)"/>

  <!-- Light reflection -->
  <ellipse cx="200" cy="60" rx="140" ry="50" fill="rgba(255,255,255,0.14)"/>

  <polygon points="200,80 212,115 248,115 220,136 230,172 200,150 170,172 180,136 152,115 188,115" fill="#fbbf24"/>
    <circle cx="200" cy="80" r="8" fill="#fde68a"/>

  <!-- Blob body -->
  <g clip-path="url(#circle)">
    <ellipse cx="200" cy="460" rx="185" ry="220" fill="#1a0a3d"/>
  </g>

  <!-- Left eye white -->
  <circle cx="144" cy="268" r="38" fill="white"/>
  <circle cx="150" cy="274" r="22" fill="#0d0d1a"/>
  <circle cx="140" cy="262" r="8" fill="white" opacity="0.9"/>

  <!-- Right eye white -->
  <circle cx="256" cy="268" r="38" fill="white"/>
  <circle cx="262" cy="274" r="22" fill="#0d0d1a"/>
  <circle cx="252" cy="262" r="8" fill="white" opacity="0.9"/>
</svg>